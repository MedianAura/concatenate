allowBuilds:
  esbuild: true
  unrs-resolver: true
minimumReleaseAgeStrict: true
# The maturity delay guards against compromised third-party publishes. Our own
# packages are published from these repos, so consuming them same-day is the point.
minimumReleaseAgeExclude:
  - '@medianaura/*'
onlyBuiltDependencies:
  - esbuild
