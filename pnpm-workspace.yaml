allowBuilds:
  esbuild: true
  unrs-resolver: true
minimumReleaseAgeStrict: true
# Le délai de maturité protège des publications tierces compromises. Nos propres
# paquets sont publiés depuis ces dépôts : les consommer le jour même est le but.
minimumReleaseAgeExclude:
  - '@medianaura/*'
onlyBuiltDependencies:
  - esbuild
